<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
/*=====================*/
/*  base  */ 
/*=====================*/
*, ::before, ::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #ffffff;
  --text: #111111;
  --bg-dark: #151515;
  --text-light: #f5f5f5;
  --primary: #e50914;
  --secondary: #00a8e1;
  --accent: #c7ea46;
}

html {
  font-size: 100%;
  scroll-behavior: smooth;
  scrollbar-gutter: stable;
}

body {
  background-color: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 1rem;
  line-height: 1.6;
}

a {
  color: inherit;
  text-decoration: none;
  transition: opacity 0.2s;
}

a:hover {
  opacity: 0.7;
}

a[disabled] {
  pointer-events: none;
}

h1, h2, h3, h4, h5, h6 {
  font-size: 1rem;
  font-weight: 700;
}

img {
  vertical-align: middle;
  max-width: 100%;
  height: auto;
}

ul, ol, dd {
  margin: 0;
  padding: 0;
}

ul, ol {
  list-style: none;
}

button {
  border: none;
  background-color: transparent;
  font: inherit;
  cursor: pointer;
}

input, textarea, select {
  font: inherit;
}



/*=====================*/
/*  Body  */ 
/*=====================*/
.main a:hover {
  opacity: 1;
}

.searchContainer {
  width: 90%;
  max-width: 1200px;
  margin: 2.5rem auto 0;
  
  #searchInput {
    width: 100%;
    max-width: 25rem;
    border: 2px solid var(--bg-dark);
    border-radius: 8px;
    outline: none;
    padding: 0.5rem 1rem;
    font-size: 0.8rem;
    font-weight: bold;
    transition: 0.2s;
  }
  
  #searchInput:focus {
    border-color: var(--secondary);
  }
}

.filterContainer {
  display: flex;
  gap: 10px;
  align-items: center;
  width: 90%;
  max-width: 1200px;
  margin: 1rem auto 0;
  
  .filterBtn {
    border: 2px solid var(--bg-dark);
    border-radius: 20px;
    padding: 0.4rem 1rem;
    background-color: var(--bg);
    color: var(--text);
    font-size: 0.8rem;
    font-weight: bold;
    transition: 0.2s;
  }
  
  .filterBtn.active,
  .filterBtn:hover {
    background-color: var(--bg-dark);
    color: var(--text-light);
  }
}

.videolist {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(clamp(9rem, calc(50% - 10px), 12rem), 1fr));
  gap: 20px;
  justify-content: center;
  width: 90%;
  max-width: 1200px;
  margin: 1.3rem auto 3.5rem;
  
  .content {
    width: 100%;
    cursor: pointer;
  }
  
  .badge {
    position: absolute;
    top: 0;
    right: 0;
    z-index: 2;
    border-radius: 4px 8px 4px 4px;
    padding: 0.1rem 0.5rem;
    font-size: 0.7rem;
    font-weight: bold;
    pointer-events: none;
  }
  
  .badge-normal {
    background-color: var(--bg);
    color: var(--text);
  }
  
  .badge-new {
    background-color: var(--primary);
    color: var(--text-light);
  }
  
  .popupBtn {
    display: block;
    position: relative;
    width: 100%;
    text-decoration: none;
    transition: transform 0.2s ease;
    
    &:hover {
      transform: translateY(-4px);
    }
    
    img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 4px 10px color-mix(in srgb, var(--bg-dark) 10%, transparent);
    }
  }
}

.popupOverlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 100;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
  background-color: color-mix(in srgb, var(--bg-dark) 70%, transparent);
  
  .popupContent {
    position: relative;
    width: 90%;
    max-width: 900px;
    max-height: 85vh;
    border-radius: 12px;
    padding-bottom: 3rem;
    background-color: var(--bg);
    box-shadow: 0 10px 25px color-mix(in srgb, var(--bg) 30%, transparent);
    color: var(--text);
    text-align: center;
    overflow-y: auto;
  }
  
  .popupHeader {
    display: flex;
    position: sticky;
    top: 0;
    z-index: 10;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    border-bottom: 1px solid color-mix(in srgb, var(--bg-dark) 50%, transparent);
    padding: 10px 20px;
    background-color: color-mix(in srgb, var(--bg) 80%, transparent);
    backdrop-filter: blur(4px);
    
    .popupSelectWrapper {
      max-width: 90%;
    }
    
    .popupSelect {
      max-width: 100%;
      border-radius: 6px;
      outline: none;
      padding: 0.5rem 0.7rem;
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-size: 0.9rem;
      font-weight: 700;
      white-space: nowrap;
      text-overflow: ellipsis;
      cursor: pointer;
      overflow: hidden;
    }
    
    .closePopup {
      background-color: transparent;
      color: var(--bg-dark);
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
    }
  }
  
  .popupMainImg {
    width: 90%;
    max-width: 750px;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    margin: 1rem auto;
    border-radius: 8px;
  }
  
  .popupTitle {
    width: 90%;
    margin: 1.5rem auto 0;
    font-size: 1.5rem;
  }
  
  .popupString {
    width: 90%;
    max-width: 750px;
    margin: 1rem auto;
    font-size: 1rem;
    text-align: left;
    white-space: pre-wrap;
  }
  
  .popupHeading {
    display: block;
    width: 100%;
    margin: 3rem auto 1.5rem;
    font-size: 1.3rem;
    font-weight: 700;
    
    &::before,
    &::after {
      content: "";
      display: inline-block;
      position: relative;
      top: -5px;
      width: 40px;
      height: 3px;
      margin: 0 15px;
      background-color: var(--primary);
    }
  }
  
  .popupYoutube {
    width: 90%;
    max-width: 750px;
    aspect-ratio: 16 / 9;
    margin: 0 auto;
    border: none;
    border-radius: 8px;
  }
  
  .popupLinks {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
    width: 90%;
    margin: 0 auto;
    
    a {
      display: inline-block;
      width: 150px;
      border: 2px solid var(--bg-dark);
      border-radius: 6px;
      padding: 0.6rem 1rem;
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-size: 0.9rem;
      font-weight: 700;
      transition: background-color 0.2s, color 0.2s;
    }
    
    a:hover {
      background-color: var(--bg);
      color: var(--text);
    }
  }   
}
    </style>
  </head>
  <body>
    <main class="main">
      <div class="searchContainer">
        <input type="text" id="searchInput" placeholder="Search for Videos" autocomplete="off">
      </div>
      <div class="filterContainer">
        <button class="filterBtn active" data-category="All">All</button>
        <button class="filterBtn" data-category="Anime">Anime</button>
        <button class="filterBtn" data-category="Movie">Movie</button>
        <button class="filterBtn" data-category="Drama">Drama</button>
      </div>
      <div id="videoList" class="videolist"></div>
      <div id="popupOverlay" class="popupOverlay">
        <div id="popupContent" class="popupContent">
          <div class="popupHeader">
            <div class="popupSelectWrapper">
              <select id="popupSelect" class="popupSelect"></select>
            </div>
            <button id="closePopup" class="closePopup">&times;</button>
          </div>
          <img id="popupImg" class="popupMainImg" src="" alt="">
          <h2 id="popupTitle" class="popupTitle"></h2>
          <p id="popupString" class="popupString"></p>
          <span class="popupHeading pv">PV</span>
          <iframe id="popupYoutube" class="popupYoutube pv" src="" title="PV" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          <span class="popupHeading">Links</span>
          <div id="popupLinks" class="popupLinks"></div>
        </div>
      </div>
      <script src="https://jinta-1066.github.io/personal/data/videos/videolist.js"></script>
      <script>
        // ===================================================
        // 2. DOM要素の取得
        // ===================================================
        const videoList = document.getElementById('videoList');
        const popupOverlay = document.getElementById('popupOverlay');
        const popupContent = document.getElementById('popupContent');
        const closePopup = document.getElementById('closePopup');
        
        const popupSelect = document.getElementById('popupSelect');
        const popupImg = document.getElementById('popupImg');
        const popupTitle = document.getElementById('popupTitle');
        const popupString = document.getElementById('popupString');
        const popupYoutube = document.getElementById('popupYoutube');
        const popupLinks = document.getElementById('popupLinks');
        
        let currentCategory = 'All';
        const searchInput = document.getElementById('searchInput');
        const filterContainer = document.querySelector('.filterContainer');
        
        let scrollTimer = null;
        function resetPopupScroll() {
          if (scrollTimer) clearTimeout(scrollTimer);
          
          scrollTimer = setTimeout(() => {
            if (popupContent) popupContent.scrollTop = 0;
            if (popupOverlay) popupOverlay.scrollTop = 0;
          }, 10);
        }
        
        // ===================================================
        // 3. 動画一覧（サムネイルカード）の描画（フィルタリング対応）
        // ===================================================
        function renderVideoList() {
          videoList.innerHTML = '';
          
          if (typeof videoData === 'undefined') return;
          
          const query = searchInput ? searchInput.value.trim().toLowerCase() : '';
          
          if (filterContainer) {
            filterContainer.style.display = query !== '' ? 'none' : 'flex';
          }
          
          const filteredVideos = videoData.filter(item => {
            if (!item.id || !Array.isArray(item.series)) return false;
            
            const matchesCategory = (query !== '') 
            ? true 
            : (currentCategory === 'All' || item.series.some(s => s.category === currentCategory));
            
            let matchesSearch = true;
            if (query !== '') {
              const searchTargets = [
                item.id,
                ...item.series.map(s => s.tabName),
                ...item.series.map(s => s.title)
              ];
              
              matchesSearch = searchTargets.some(target => 
                target && target.toLowerCase().includes(query)
              );
            }
            
            return matchesCategory && matchesSearch;
          });
          
          filteredVideos.forEach(item => {
            const contentDiv = document.createElement('div');
            contentDiv.className = 'content';
            
            let badgeHtml = '';
            if (item.badge) {
              const positionClass = item.badge.toLowerCase() === 'new' ? 'badge-new' : 'badge-normal';
              badgeHtml = `<span class="badge ${positionClass}">${item.badge}</span>`;
            }
            
            const altText = (item.series && item.series[0]) ? item.series[0].title : '';
            contentDiv.innerHTML = `<a class="popupBtn">${badgeHtml}<img src="${item.thumb}" alt="${altText}"loading="lazy"></a>`;
            
            contentDiv.addEventListener('click', () => {
              openPopup(item, query, currentCategory);
            });
            
            videoList.appendChild(contentDiv);
          });
        }
        
        function openPopup(item, query = '', category = 'All') {
          if (!item.series || item.series.length === 0) return;
          
          popupSelect.innerHTML = '';
          let defaultIndex = 0;
          
          if (query !== '') {
            const matchedIndex = item.series.findIndex(s => 
              (s.title && s.title.toLowerCase().includes(query)) ||
              (s.tabName && s.tabName.toLowerCase().includes(query))
            );
            if (matchedIndex !== -1) defaultIndex = matchedIndex;
            
          } else if (category !== 'All') {
            const matchedCategoryIndex = item.series.findIndex(s => s.category === category);
            if (matchedCategoryIndex !== -1) defaultIndex = matchedCategoryIndex;
          }
          
          item.series.forEach((seriesItem, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = seriesItem.tabName || seriesItem.title;
            popupSelect.appendChild(option);
          });
          
          popupSelect.onchange = (e) => {
            const selectedIndex = e.target.value;
            updatePopupDetail(item.series[selectedIndex]);
          };
          
          popupSelect.value = defaultIndex;
          updatePopupDetail(item.series[defaultIndex]);
          
          popupOverlay.style.display = 'flex';
          resetPopupScroll();
          document.body.style.overflow = 'hidden';
        }
        
        // タブ切り替え時に中身を書き換える関数
        function updatePopupDetail(seriesItem) {
          popupTitle.textContent = seriesItem.title || '';
          popupImg.src = seriesItem.thumb || '';
          popupString.textContent = seriesItem.description || '';
          
          const pvElements = document.querySelectorAll('.pv');
          if (seriesItem.youtubeUrl && seriesItem.youtubeUrl.trim() !== '') {
            popupYoutube.src = '';
            pvElements.forEach(el => el.style.display = '');
            setTimeout(() => {
              popupYoutube.src = seriesItem.youtubeUrl;
            }, 20);
          } else {
            popupYoutube.src = '';
            pvElements.forEach(el => el.style.display = 'none');
          }
          
          popupLinks.innerHTML = '';
          if (seriesItem.links) {
            seriesItem.links.forEach(link => {
              const a = document.createElement('a');
              a.href = link.url;
              a.textContent = link.text;
              a.target = '_blank';
              a.rel = 'noopener noreferrer';
              popupLinks.appendChild(a);
            });
          }
          
          resetPopupScroll();
        }
        
        // ===================================================
        // 5. フィルターボタンのイベント登録
        // ===================================================
        searchInput.addEventListener('input', () => {
          renderVideoList();
        });
        
        document.querySelectorAll('.filterBtn').forEach(button => {
          button.addEventListener('click', () => {
            document.querySelectorAll('.filterBtn').forEach(b => b.classList.remove('active'));
            button.classList.add('active');
            
            currentCategory = button.dataset.category;
            renderVideoList();
          });
        });
        
        // ===================================================
        // 6. ポップアップの閉じる処理
        // ===================================================
        function hidePopup() {
          popupOverlay.style.display = 'none';
          popupYoutube.src = '';
          document.body.style.overflow = '';
        }
        
        closePopup.addEventListener('click', hidePopup);
        
        popupOverlay.addEventListener('click', (e) => {
          if (!popupContent.contains(e.target)) {
            hidePopup();
          }
        });
        
        renderVideoList();
      </script>
    </main>
  </body>
</html>
